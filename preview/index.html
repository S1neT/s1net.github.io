<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a090b">
<meta name="description" content="s1net — стримы, соцсети и ссылки.">
<title>s1net</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#bca17c;--muted:#8d8075;--blood:#742b32}
*{box-sizing:border-box}html{min-height:100%}body{min-height:100svh;margin:0;background:#07080a;color:#e3d9c9;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:#09090b;z-index:-4}
.scene{background-image:linear-gradient(90deg,#05050644,transparent 25%,#08070945 50%,transparent 75%,#05050644),linear-gradient(180deg,#08070911,#08070944),url("./s1net-background.webp");background-position:center;background-size:cover;background-repeat:no-repeat;position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;opacity:1}.scene svg{width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 65% 75% at 50% 50%,transparent 30%,#06060770 100%),linear-gradient(180deg,#05050622,transparent 40%,#05050677 100%)}
.shell{max-width:720px;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:64px 22px 34px}
.brand-area{position:relative;text-align:center;padding:34px 0 22px;isolation:isolate}



.brand{font-family:'UnifrakturCook',Georgia,serif;font-size:clamp(5.2rem,17vw,9rem);font-variant:normal;text-transform:none;line-height:1;letter-spacing:.015em;margin:15px 0 10px;font-weight:700;color:#e1d1b5;text-shadow:0 2px 0 #40342d,0 5px 0 #171315,0 14px 30px #000,0 0 65px #a0444544}
.rule{height:1px;max-width:370px;margin:29px auto 9px;background:linear-gradient(90deg,transparent,#a38b68 30%,#e0bd86 50%,#a38b68 70%,transparent);position:relative}.rule:after{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#181316;padding:0 13px;color:#c2a17a;font-size:10px}
.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:13px;margin:29px auto 35px;max-width:100%}
.social{position:relative;width:66px;height:66px;display:grid;place-items:center;text-decoration:none;color:#d9c5a8;border:1px solid #84694f;background:linear-gradient(145deg,#2d2526ee,#100f12f2);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);box-shadow:inset 0 0 0 4px #0a090c;transition:transform .2s,background .2s,color .2s}
.social i{font-size:26px;filter:drop-shadow(0 2px 3px #000)}.social:hover,.social:focus-visible{transform:translateY(-4px);background:#54272c;color:#fff;outline:2px solid #ae8a68;outline-offset:3px}
.extra{position:relative;max-width:620px;width:100%;align-self:center;text-align:center;padding:33px 28px 35px;background:linear-gradient(140deg,#211b1de8,#0e0e11f2);border:1px solid #78614a;box-shadow:inset 0 0 0 5px #0c0b0d,inset 0 0 0 6px #6a51433c,0 16px 60px #0009;clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px))}
.extra:before,.extra:after{content:"✦";position:absolute;top:12px;font-size:12px;color:#9b7b5c}.extra:before{left:19px}.extra:after{right:19px}
.extra h2{font-size:16px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:#cdb28a;margin:0 0 16px}.extra h2:after{content:"";display:block;height:1px;width:95px;margin:15px auto 0;background:linear-gradient(90deg,transparent,#8e6b53,transparent)}
.extra p{font:14px/1.85 system-ui,sans-serif;color:#b4a79c;margin:0}
.footer{text-align:center;margin-top:32px;font:10px system-ui,sans-serif;letter-spacing:.25em;color:#81736c}
@media(max-width:480px){.shell{padding:44px 15px 28px}.brand-area{padding-top:28px}.brand-area:before{inset:0 1% -8px}.moon{width:215px;height:215px;top:-60px}.social{width:55px;height:55px}.social i{font-size:23px}.socials{gap:9px}.extra{padding:28px 20px}.extra h2{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Ornate gothic social frames — CSS only, no extra assets */
.socials{gap:17px;margin:33px auto 40px}
.social{
 width:72px;height:76px;position:relative;isolation:isolate;overflow:visible;
 display:grid;place-items:center;flex:0 0 auto;
 color:#dfc8a7;text-decoration:none;
 border:1px solid #967758;
 background:linear-gradient(145deg,#4b3530 0%,#211a1d 22%,#0a090c 66%,#342021 100%);
 clip-path:polygon(0 13px,13px 0,calc(100% - 13px) 0,100% 13px,100% calc(100% - 13px),calc(100% - 13px) 100%,13px 100%,0 calc(100% - 13px));
 box-shadow:inset 0 0 0 3px #100e11,inset 0 0 0 4px #8e7053, inset 0 0 22px #000;
 transition:transform .2s ease,color .2s ease,filter .2s ease;
}
.social:before{
 content:"";position:absolute;inset:7px;z-index:-1;
 border:1px solid #8f715a8c;
 background:radial-gradient(circle at 50% 36%,#7b2a2b33,transparent 75%);
 clip-path:polygon(0 9px,9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px));
}
.social:after{
 content:"✦";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
 color:#bd8865;font-size:9px;line-height:1;
}
.social i{font-size:27px;line-height:1;filter:drop-shadow(0 2px 4px #000);transform:translateY(-3px)}
.social:hover,.social:focus-visible{
 transform:translateY(-5px);color:#fff1d9;
 filter:drop-shadow(0 0 12px #a52f3855);
 background:linear-gradient(145deg,#603335,#261619 50%,#140d11);
 outline:2px solid #bda17b;outline-offset:4px;
}
@media(max-width:480px){
 .socials{gap:10px}
 .social{width:57px;height:63px}
 .social i{font-size:23px}
 .social:after{font-size:8px}
}


/* Polished, restrained gothic icon interactions */
.social{
 transition:transform .32s cubic-bezier(.2,.8,.2,1),color .25s ease,filter .35s ease,background .35s ease;
 will-change:auto;
}
.social i{
 transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .3s ease;
}
.social:before{
 transition:border-color .3s ease,background .35s ease,box-shadow .35s ease;
}
.social:after{
 transition:color .3s ease,transform .32s ease;
}
.social:hover,.social:focus-visible{
 transform:scale(1.075);
 filter:drop-shadow(0 8px 13px #000b) drop-shadow(0 0 11px #a3333866);
 color:#fff1d8;
 background:linear-gradient(145deg,#583638 0%,#24181d 50%,#38191e 100%);
 outline:1px solid #bca07b;outline-offset:3px;
}
.social:hover:before,.social:focus-visible:before{
 border-color:#d5a778;
 background:radial-gradient(circle at 50% 40%,#a9434559,transparent 77%);
 box-shadow:inset 0 0 14px #a82f352e;
}
.social:hover i,.social:focus-visible i{
 transform:scale(1.12);
 filter:drop-shadow(0 0 8px #d19a7766);
}
.social:hover:after,.social:focus-visible:after{
 color:#efbc84;transform:translateX(-50%) scale(1.3);
}
.social:active{transform:scale(.97);transition-duration:.1s}
@media(hover:none){
 .social:hover{transform:none;filter:none}
 .social:hover i{transform:translateY(-3px);filter:drop-shadow(0 2px 4px #000)}
 .social:hover:after{transform:translateX(-50%)}
}
@media(prefers-reduced-motion:reduce){
 .social,.social i,.social:before,.social:after{transition:none!important}
 .social:hover,.social:focus-visible,.social:active{transform:none}
 .social:hover i,.social:focus-visible i{transform:translateY(-3px)}
}


/* Compact, conventional site footer */
.footer{width:100%;max-width:620px;align-self:center;margin:48px auto 0;color:#9d9287;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;letter-spacing:normal;text-align:left}
.footer-divider{height:1px;background:linear-gradient(90deg,transparent,#846b51 20%,#a58a68 50%,#846b51 80%,transparent);position:relative;margin-bottom:23px}
.footer-divider span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111013;padding:0 12px;color:#bda17c;font-size:12px}
.footer-content{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.footer-brand{font-family:'UnifrakturCook',Georgia,serif;color:#cbb18e;font-size:23px;line-height:1}
.footer-copy{color:#9f968e}
.footer-top{color:#c4a784;text-decoration:none;white-space:nowrap;transition:color .2s}
.footer-top:hover,.footer-top:focus-visible{color:#fff0d4;text-decoration:underline;text-underline-offset:4px}
.footer-top i{font-size:17px;vertical-align:middle}
@media(max-width:480px){.footer{margin-top:35px}.footer-content{justify-content:center;text-align:center;column-gap:16px;row-gap:10px}.footer-copy{flex-basis:100%;order:3}.footer-top{order:2}}


/* Gothic reliquary frame for the chronicles card */
.extra{
 position:relative;isolation:isolate;overflow:visible;
 border:1px solid #9b7957;
 background:linear-gradient(145deg,#221b1eeb,#100e12f5 48%,#1b1317ef);
 box-shadow:0 15px 35px #0008,inset 0 0 0 4px #100d10,inset 0 0 0 5px #75583e,inset 0 0 28px #000b;
 clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px));
 padding:40px 34px 38px;
}
.extra:before{
 content:"";position:absolute;inset:11px;z-index:-1;pointer-events:none;
 border:1px solid #98714f99;
 clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px));
 background:radial-gradient(ellipse at 50% 0%,#8b4b3930,transparent 62%);
}
.extra:after{
 content:"✥";position:absolute;top:8px;left:50%;transform:translateX(-50%);
 color:#b99469;font-size:18px;line-height:1;text-shadow:0 0 12px #bd6e4a66;pointer-events:none;
}
.extra h2{position:relative;color:#d9b88b;text-shadow:0 1px 8px #000;letter-spacing:.2em}
.extra h2:after{content:none;display:none}
.extra p{position:relative;color:#bdb0a7}
@media(max-width:480px){.extra{padding:39px 20px 29px}.extra h2{letter-spacing:.12em}.extra h2:after{font-size:8px}}

</style>
</head>
<body>

<main class="container shell mx-auto">
 <header class="brand-area"><h1 class="brand">s1net</h1><div class="rule" aria-hidden="true"></div></header>
 <nav class="socials" aria-label="Социальные сети">

 </nav>
 <section class="extra" aria-label="Дополнительная информация"><h2>Хроники странника</h2><p>Место для твоих объявлений, новых ссылок и всего, что появится позже.</p></section>
 <footer class="footer" role="contentinfo"><div class="footer-content"><span class="footer-copy">© <span id="footer-year">2026</span> s1net. Все права защищены.</span><a class="footer-top" href="#" aria-label="Наверх">Наверх <i class="bi bi-arrow-up-short" aria-hidden="true"></i></a></div></footer>
</main>
<script>document.getElementById("footer-year").textContent=new Date().getFullYear();</script>
</body></html>
